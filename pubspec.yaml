name: duanju_app
description: 独立运行的多端短剧android6.0应用 flutter 3.32.8
publish_to: none
version: 0.2.64+71

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  video_player: ^2.9.2
  ffi: ^2.2.0
  media_kit: ^1.0.7
  media_kit_video: ^1.0.7
  media_kit_libs_video: ^1.0.7
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: 2.5.3          # 降级，兼容 Dart 3.8
  flutter_foreground_task: 9.2.2
  ffmpeg_kit_flutter_new_min_gpl: 2.6.2
  file_picker: 9.2.1                # 降级，兼容较低 Dart
  crypto: ^3.0.7
  window_manager: ^0.5.1
  nsd: 4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0             # 适当降级
  shared_preferences_platform_interface: 2.4.1

dependency_overrides:
  media_kit_libs_windows_video:
    path: packages/media_kit_libs_windows_video
  shared_preferences_platform_interface: 2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/video_enhancement/